---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: postgres-provisioner
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - postgres-provisioner.io
  resources:
  - postgresinstances
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - postgres-provisioner.io
  resources:
  - postgresinstances/status
  verbs:
  - get
  - patch
  - update
