apiVersion: v1
kind: Secret
metadata:
  name: app-database
  namespace: app
  labels:
    postgres-provisioner.io/managed: "true"
    postgres-provisioner.io/instance: main
type: Opaque
stringData:
  # Optional; defaults to username.
  database: app_database
  username: app_user
  password: REPLACE_WITH_A_LONG_RANDOM_PASSWORD
